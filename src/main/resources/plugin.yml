name: DialogueHud
version: '${project.version}'
main: com.goga221.dialoguehud.DialogueHudPlugin
api-version: '1.21'
folia-supported: true
author: goga221
description: Scroll-and-select dialogue trees rendered through BetterHud, separate from text chat.
depend: [CommandAPI, BetterHud, FancyNpcs]

permissions:
  dialoguehud.admin:
    description: Allows starting, stopping and reloading dialogues.
    default: op
